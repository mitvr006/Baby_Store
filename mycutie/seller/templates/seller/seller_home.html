<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }

        .welcome-card {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 20px;
        }

        .welcome-card h1 {
            font-size: 32px;
            color: #343a40;
            margin-bottom: 10px;
        }

        .welcome-card p {
            font-size: 18px;
            color: #6c757d;
        }

        .welcome-card .btn {
            margin-top: 15px;
        }

        /* Banner image styling */
        .banner img {
            width: 100%;
            /* max-width: 800px; */
            height: auto;
            /* margin-left: 10px;    */
            height: 330px;
            object-fit: cover;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
            
    </style>
</head>

<body>
    <!-- Include Header -->
    {% include "seller/seller_header.html" %}
    {% include "message.html" %}

    <!-- Banner -->
    
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <!-- Add the banner image -->
                <div class="banner">
                    <!-- {% load static %} -->
                    <img src="{% static '/images/banner.jpg' %}" alt="Sell Online with Baby Shop">
                </div>
            </div>
        </div>

        <!-- Welcome Message -->
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="welcome-card text-center">
                    <h1>Welcome, Seller!</h1>
                    <p>Manage your products and orders with ease using our powerful tools. Stay updated with the latest insights and improve your business!</p>
                    <a href="{% url 'seller_dashboard' %}" class="btn btn-primary">
                        <i class="fas fa-home"></i> Go to Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
