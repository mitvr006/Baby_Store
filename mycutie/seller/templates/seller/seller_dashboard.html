<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
        }

        .dashboard-wrapper {
            display: flex;
            height: 100vh;
        }

        .dashboard-sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .dashboard-sidebar h4 {
            margin-bottom: 30px;
            font-weight: bold;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-item {
            margin-bottom: 15px;
        }

        .sidebar-link {
            text-decoration: none;
            color: white;
            font-size: 16px;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
        }

        .sidebar-link:hover {
            background-color: #495057;
        }

        .dashboard-content {
            flex-grow: 1;
            padding: 20px;
            background-color: #ffffff;
            border-left: 1px solid #dee2e6;
        }

        .dashboard-content h1 {
            font-size: 28px;
            color: #343a40;
            margin-bottom: 20px;
        }

        .dashboard-content p {
            font-size: 16px;
            color: #6c757d;
        }

        /* Responsive Sidebar */
        @media (max-width: 768px) {
            .dashboard-sidebar {
                width: 200px;
                padding: 10px;
            }

            .sidebar-link {
                font-size: 14px;
            }
        }

        @media (max-width: 576px) {
            .dashboard-wrapper {
                flex-direction: column;
            }

            .dashboard-sidebar {
                width: 100%;
                text-align: center;
            }

            .sidebar-link {
                display: inline-block;
                margin: 5px;
            }

            .dashboard-content {
                border-left: none;
            }
        }
    </style>
</head>

<body>
    {% include "seller/seller_header.html" %}
    {% include "message.html" %}

    <div class="dashboard-wrapper">
        <!-- Sidebar -->
        <nav class="dashboard-sidebar">
            <div class="text-center">
                <h4>Seller Dashboard</h4>
            </div>
            <ul class="sidebar-menu">
                <li class="sidebar-item">
                    <a href="{% url 'view_products' %}" class="sidebar-link">
                        <i class="fas fa-box"></i> View Products
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="{% url 'view_orders' %}" class="sidebar-link">
                        <i class="fas fa-shopping-cart"></i> View Orders
                    </a>
                </li>
                <li class="sidebar-item">
                    <a href="{% url 'add_product' %}" class="sidebar-link">
                        <i class="fas fa-plus"></i> Add Product
                    </a>
                </li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="dashboard-content">
            <h1>Welcome to Seller Dashboard</h1>
            <p>Manage your products and orders efficiently!</p>
        </div>
    </div>
</body>

</html>
