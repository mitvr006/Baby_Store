<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login</title>
    <style>
        .container {
            max-width: 400px;
            padding: 30px;
            background: rgb(216, 216, 216);
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            margin-left: 500px;
            margin-top: 100px;
        }
        .container h2 {
            margin-bottom: 40px;
            text-align: center;
            color: black;
            font-size: 160%;
        }
        .container label {
            display: block;
            margin-bottom: 5px;
            margin-top: 20px;
        }
        .container input {
            width: 100%;
            padding: 10px;
            background-color: rgb(250, 249, 249);
            margin-bottom: 10px;
            border: 1px solid #bfb5b5;
            border-radius: 5px;
        }
        .container button {
            width: 100%;
            background-color: rgb(47, 45, 45);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .container button:hover {
            background-color: rgb(6, 3, 3);
        }
        .container p {
            margin-top: 20px;
            text-align: center;
        }
        .container a {
            color: rgb(126, 126, 189);
            text-decoration: none;
        }
        .container a:hover {
            color: rgb(71, 71, 203);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    {% include 'message.html' %}
    <div class="container">
        <h2>Seller Login</h2>   
        <form method="post" action="">
            {% csrf_token %}
            <label for="username">email:</label>
            <input type="text" id="username" name="email" required>
            <br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <br>

            <div class="forgot-password">
                <a href="forgot-password">Forgot your password?</a>
            </div>

            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="{% url 'seller_register' %}">register now</a></p>
    
    </div>
</body>
</html>
