<h2>Your Products</h2>
<table class="table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Photo</th>
            <th>Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.id }}</td>
            <td><img src="{{ product.photo.url }}" alt="{{ product.name }}" width="50" height="50"></td>
            <td>{{ product.name }}</td>
            <td>{{ product.category.name }}</td>
            <td>{{ product.quantity }}</td>
            <td>₹{{ product.price }}</td>
            <td>
                <a href="{% url 'edit_product' product.id %}" class="btn btn-primary btn-sm">Edit</a>
                <a href="{% url 'remove_product' product.id %}" class="btn btn-danger btn-sm"
                    onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="7">No products found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
