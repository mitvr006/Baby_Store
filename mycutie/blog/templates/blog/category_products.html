<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ category.name }} Products</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Overall body styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        /* Heading styling */
        .title-text-center {
            text-align: center;
            margin-top: 20px;
            color: #333;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Product grid styling */
        .product-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        /* products styling for each product */
        .products {
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 250px;
            text-align: center;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            /* transition: transform 0.3s ease, box-shadow 0.3s ease; */
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .products:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Products image styling for each product */
        .products img {
            max-width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Products text styling for each product */
        .products h2 {
            font-size: 18px;
            color: #333;
            margin: 10px 0 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            font-weight: bold;
            margin-bottom: 10px;
            padding: 0 10px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            line-height: 1.5;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .products a {
            text-decoration: none;
            color: #333;
        }

        .products a:hover {
            text-decoration: underline;
        }

        /* Products description styling for each product */
        .products p {
            font-size: 14px;
            color: #666;
            margin: 5px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            margin-bottom: 10px;
            padding: 0 10px;
            line-height: 1.5;
        }

        /* Products price styling for each product */
        .products .price {
            font-weight: bold;
            font-size: 14px;
            color: #000;
            margin-bottom: 15px;
        }

    </style>
</head>
<body>
    {% include "header.html" %}

    <h1 class="title-text-center">Products in {{ category.name }}</h1>
    <div class="product-grid">
        {% for product in products %}
        <div class="products">
            <a href="{% url 'product_detail' product.id %}">
                <img src="{{ product.image.url }}" alt="{{ product.name }}">
            </a>
            <h2>{{ product.name }}</h2>
            <p>{{ product.description }}</p>
            <p class="price">Price: ${{ product.price }}</p>
        </div>
        {% empty %}
        <p>No products available in this category.</p>
        {% endfor %}
    </div>
</body>
</html>
