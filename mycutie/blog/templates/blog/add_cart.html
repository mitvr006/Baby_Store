<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }
        input, select, textarea, button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            transition: border-color 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #4CAF50;
            outline: none;
        }
        textarea {
            resize: vertical;
        }
        button, .cancel {
            width: 30%; /* Ensure buttons are equal width */
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button {
            background-color: #4CAF50;
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(1);
        }
        .cancel {
            background-color: #f44336;
        }
        .cancel:hover {
            background-color: #e53935;
            transform: scale(1.05);
        }
        .cancel:active {
            transform: scale(1);
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Product</h1>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <label for="id_name">Product Name:</label>
            {{ form.name }}

            <label for="id_description">Description:</label>
            {{ form.description }}

            <label for="id_price">Price:</label>
            {{ form.price }}

            <label for="id_photo">Image:</label>
            {{ form.image }}

            <label for="id_category">Category:</label>
            {{ form.category }}

            <div class="buttons">
                <button type="submit">Create Product</button>
                <a href="{% url 'product_list' %}" class="cancel">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
