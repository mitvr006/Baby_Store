<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }
        .product-form {
            max-width: 450px;
            margin: 10px auto;
            margin-left: 300px;
            padding: 20px;
            background: rgb(216, 216, 216);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            color: #444;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            margin-top: 5px;
            margin-bottom: 5px;
            margin-left: 5px;
            margin-right: 5px;
            text-align: left;
        }
        input, select, textarea, button, .cancel {
            width: 95%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease-in-out;
            color: #333;
            background-color: rgb(237, 236, 236);
            text-align: left;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
        input[type="file"] {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease-in-out;
            color: #333;
            background-color: rgb(237, 236, 236);
            cursor: pointer;
        }
        input[type="file"]:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
        input[type="file"]::-webkit-file-upload-button {
            background-color: #4CAF50;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }
        input[type="file"]::-webkit-file-upload-button:hover {
            background-color: #45a049;
        }
        select {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease-in-out;
            color: #333;
            background-color: rgb(237, 236, 236);
        }
        select:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
        input[type="number"] {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease-in-out;
            color: #333;
            background-color: rgb(237, 236, 236);
        }
        input[type="number"]:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
        input[type="date"] {
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease-in-out;
            color: #333;
            background-color: rgb(237, 236, 236);
        }
        input[type="date"]:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
        textarea {
            width: 95%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease-in-out;
            color: #333;
            background-color: rgb(237, 236, 236);
            resize: vertical;
        }
        textarea:focus {
            border-color: #4CAF50;
            outline: none;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
        .error {
            color: red;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .success {
            color: green;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        button, .cancel {
            display: inline-block;
            width: 40%; /* Ensure buttons are equal width */
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        button {
            background-color: #6ac16d;
        }
        button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
        button:active {
            transform: scale(1);
        }
        .cancel {
            background-color: #db5c53;
        }
        .cancel:hover {
            background-color: #e53935;
            transform: scale(1.05);
        }
        .cancel:active {
            transform: scale(1);
        }
        .buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    {% include "header.html" %}

    <!-- <div class="container"> -->
        
        <form  class="product-form" method="POST" enctype="multipart/form-data">
            <h2>Create Product</h2>

            {% csrf_token %}
            <label for="id_name">Product Name:</label>
            {{ form.name }}

            <label for="id_description">Description:</label>
            {{ form.description }}

            <label for="id_price">Price:</label>
            {{ form.price }}

            <label for="id_photo">Image:</label>
            {{ form.image }}

            <label for="id_category">Category:</label>
            {{ form.category }}

            <div class="buttons">
                <button type="submit">Create Product</button>
                <a href="{% url 'product_list' %}" class="cancel">Cancel</a>
            </div>
        </form>
    <!-- </div> -->
</body>
</html>
